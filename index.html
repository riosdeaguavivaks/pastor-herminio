<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pastor Herminio C. Leal — Contacto</title>
<meta name="theme-color" content="#061d46">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#061d46;
  color:#fff;
}
.card{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:
    radial-gradient(circle at 70% 4%, rgba(40,140,255,.5), transparent 25%),
    linear-gradient(180deg,#07163a 0%,#083d8f 45%,#041a43 100%);
  overflow:hidden;
}
.hero{
  padding:22px 20px 10px;
  text-align:center;
}
.logo{
  width:150px;height:150px;object-fit:cover;
  border-radius:50%;
  display:block;margin:0 auto 10px;
}
.church{
  font-family:Georgia,serif;
  font-size:26px;letter-spacing:1px;
  margin:0;
}
.sub{font-size:13px;letter-spacing:5px;margin-top:4px}
.pastor-wrap{
  display:grid;
  grid-template-columns:42% 58%;
  align-items:end;
  margin-top:12px;
}
.portrait-box{
  height:270px; overflow:hidden; position:relative;
}
.portrait{
  width:215%; height:100%; object-fit:cover; object-position:12% 48%;
  transform:translateX(-4%);
}
.namebox{
  padding:12px 10px 26px 0;
  text-align:left;
}
.script{
  font-family:Georgia,serif;
  font-style:italic;
  font-size:34px;
  margin-bottom:2px;
}
.name{
  font-family:Georgia,serif;
  font-weight:700;
  font-size:37px;
  line-height:.98;
  text-transform:uppercase;
}
.actions{
  padding:10px 18px 22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn{
  min-height:78px;
  border-radius:22px;
  text-decoration:none;
  color:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  font-weight:800;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.18);
}
.btn .ico{
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.16);
  font-size:25px;flex:0 0 46px;
}
.btn small{display:block;font-weight:600;opacity:.95;font-size:13px;margin-top:2px}
.call{background:linear-gradient(135deg,#1377e8,#0b3f91)}
.text{background:linear-gradient(135deg,#18b759,#08752f)}
.fb{background:linear-gradient(135deg,#2082ff,#0b4eb0)}
.dir{background:linear-gradient(135deg,#e94f3b,#9b1d14)}
.save{
  grid-column:1/-1;
  min-height:86px;
  justify-content:center;
  background:linear-gradient(135deg,#0f7fe8,#073e8d);
  border:2px solid rgba(255,255,255,.45);
  font-size:24px;
  text-align:center;
}
.save small{font-size:12px;letter-spacing:3px}
.footer{
  text-align:center;
  padding:0 18px 30px;
  letter-spacing:5px;
  font-size:13px;
  color:#eaf4ff;
}
@media(max-width:380px){
  .name{font-size:32px}
  .actions{grid-template-columns:1fr}
  .save{grid-column:auto}
}
</style>
</head>
