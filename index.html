<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071525">

  <title>Pastor Herminio C. Leal | Rios de Agua Viva</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #12365c 0%, #071525 40%, #030912 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 15px 15px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 185px;
      max-width: 48%;
      margin: 0 auto 10px;
      display: block;
      object-fit: contain;
    }

    .photo-wrap {
      width: 190px;
      height: 190px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #ffffff, #8297ad, #ffffff);
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
    }

    .photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
      border: 4px solid #071525;
    }

    .name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      margin: 5px 0;
    }

    .title {
      color: #b9c8d8;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .address {
      color: #d7e0e9;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 auto 25px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      width: 100%;
      min-height: 57px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 15px;
      background: linear-gradient(135deg, #183a61, #0d2846);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
      font-family: Arial, Helvetica, sans-serif;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #d7e1eb, #8799ab);
      color: #071525;
      border: none;
    }

    .icon {
      font-size: 21px;
    }

    .horario-box {
      display: none;
      width: 100%;
    }

    .horario-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    @media (max-width: 390px) {
      .photo-wrap {
        width: 170px;
        height: 170px;
      }

      .name {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="logo.png"
      alt="Rios de Agua Viva Apostolic Church"
    >

    <div class="photo-wrap">
      <img
        class="photo"
        src="pastor.jpg"
        alt="Pastor Herminio C. Leal"
      >
    </div>

    <h2 class="name">
      Pastor Herminio C. Leal
    </h2>

    <div class="title">
      Pastor
    </div>

    <div class="address">
      4000 Victory Dr.<br>
      Kansas City, KS 66102
    </div>

    <div class="buttons">

      <a
        class="btn btn-primary"
        href="tel:+18163090938"
      >
        <span class="icon">☎</span>
        Call Pastor Herminio
      </a>

      <button
        class="btn"
        type="button"
        onclick="addContact()"
      >
        <span class="icon">👤</span>
        Agregar a Contactos
      </button>

      <button
        class="btn"
        type="button"
        onclick="toggleHorario()"
      >
        <span class="icon">📅</span>
        Horario
      </button>

      <div id="horarioBox" class="horario-box">
        <img
          class="horario-img"
          src="Horario.png"
          alt="Horario de Servicios"
        >
      </div>

      <a
        class="btn"
        href="https://www.facebook.com/share/1EShZ44Z7V/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">f</span>
        Facebook
      </a>

      <a
        class="btn"
        href="https://venmo.com/u/RiosDeAguaViva-ApostolicChurch"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">💝</span>
        Donaciones
      </a>

      <a
        class="btn"
        href="https://venmo.com/u/RiosDeAguaViva-ApostolicChurch"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">🙏</span>
        Contribuciones
      </a>

      <a
        class="btn"
        href="https://www.google.com/maps/search/?api=1&query=4000+Victory+Dr+Kansas+City+KS+66102"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">📍</span>
        Cómo Llegar
      </a>

    </div>

  </main>

  <script>

    function toggleHorario() {
      const horario = document.getElementById("horarioBox");

      if (horario.style.display === "block") {
        horario.style.display = "none";
      } else {
        horario.style.display = "block";
      }
    }

    function addContact() {
      const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Leal;Herminio C.;;Pastor;
FN:Pastor Herminio C. Leal
ORG:Iglesia Apostólica Rios de Agua Viva
TITLE:Pastor
TEL;TYPE=CELL:+18163090938
ADR;TYPE=WORK:;;4000 Victory Dr.;Kansas City;KS;66102;USA
URL:https://www.facebook.com/share/1EShZ44Z7V/?mibextid=wwXIfr
END:VCARD`;

      const blob = new Blob(
        [vcard],
        { type: "text/vcard;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "Pastor-Herminio-C-Leal.vcf";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }

  </script>

</body>
</html>
