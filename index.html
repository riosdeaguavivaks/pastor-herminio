<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#064da8">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Pastor Leal"
  >

  <!-- ICONO IPHONE -->
  <link
    rel="apple-touch-icon"
    href="./logo.png"
  >

  <title>
    Pastor Herminio C. Leal | Ríos de Agua Viva
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background-color: #064da8;

      background-image:
        linear-gradient(
          rgba(0, 40, 120, 0.05),
          rgba(0, 25, 90, 0.12)
        ),
        url("./fondorav.png?v=10");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding:
        24px
        15px
        45px;
    }


    /* =========================
       TARJETA
       ========================= */

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
      width: 185px;
      max-width: 48%;
      height: auto;

      margin:
        0
        auto
        12px;

      display: block;
      object-fit: contain;

      filter:
        drop-shadow(
          0
          5px
          12px
          rgba(0,0,0,.45)
        );
    }


    /* =========================
       FOTO
       ========================= */

    .photo-wrap {
      width: 190px;
      height: 190px;

      margin:
        0
        auto
        18px;

      border-radius: 50%;
      padding: 5px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #69bdff,
          #ffffff
        );

      box-shadow:
        0 0 22px rgba(80,190,255,.75),
        0 12px 40px rgba(0,0,0,.45);
    }

    .photo {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;
      object-position: center top;

      display: block;

      border:
        4px solid
        #0750a5;
    }


    /* =========================
       NOMBRE
       ========================= */

    .name {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 27px;
      font-weight: bold;

      color: white;

      margin:
        5px
        0
        22px;

      -webkit-text-stroke:
        1.5px black;

      paint-order:
        stroke fill;

      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0px  3px 6px rgba(0,0,0,.85);
    }


    /* =========================
       BOTONES
       ========================= */

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      width: 100%;
      min-height: 57px;

      border:
        1px solid
        rgba(100,210,255,.75);

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          rgba(0,105,205,.94),
          rgba(0,52,125,.96)
        );

      color: white;
      text-decoration: none;

      font-size: 17px;
      font-weight: bold;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      padding:
        10px
        15px;

      cursor: pointer;

      box-shadow:
        0 8px 22px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.20);

      transition:
        transform .15s ease,
        filter .15s ease;
    }

    .btn:hover {
      filter: brightness(1.08);
    }

    .btn:active {
      transform: scale(.98);
    }


    /* =========================
       BOTÓN LLAMAR
       ========================= */

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #b7d9f7
        );

      color: #06346d;
      border: none;
    }


    /* =========================
       INSTALAR
       ========================= */

    .install-btn {
      background:
        linear-gradient(
          135deg,
          #087dff,
          #00459b
        );

      border:
        1px solid
        rgba(255,255,255,.45);
    }


    /* =========================
       COMPARTIR
       ========================= */

    .share-btn {
      background:
        linear-gradient(
          135deg,
          rgba(0,105,205,.94),
          rgba(0,52,125,.96)
        );
    }


    /* =========================
       YOUTUBE
       ========================= */

    .youtube-btn {
      background:
        linear-gradient(
          135deg,
          #ff2020,
          #bd0000
        );

      border:
        1px solid
        rgba(255,255,255,.40);
    }


    /* =========================
       ICONOS
       ========================= */

    .icon {
      font-size: 21px;
    }

    .youtube-icon {
      font-size: 23px;
    }


    /* =========================
       HORARIO NUEVO
       ========================= */

    .horario-box {
      display: none;

      width: 100%;

      margin-top: 3px;

      padding: 4px;

      border-radius: 16px;

      background:
        rgba(255,255,255,.15);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.30);
    }

    .horario-img {
      width: 100%;
      height: auto;

      display: block;

      border-radius: 13px;
    }


    /* =========================
       MENSAJE INSTALACIÓN
       ========================= */

    .install-box {
      display: none;

      background:
        rgba(0,28,75,.96);

      border:
        1px solid
        rgba(100,210,255,.8);

      border-radius: 15px;

      padding: 18px;

      text-align: center;

      line-height: 1.5;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.45);
    }

    .install-box strong {
      font-size: 18px;
    }

    .install-close {
      margin-top: 15px;

      padding:
        9px
        20px;

      border: none;
      border-radius: 10px;

      background: white;

      color: #064da8;

      font-weight: bold;

      cursor: pointer;
    }


    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 390px) {

      body {
        background-attachment: scroll;
        background-position: center top;
      }

      .photo-wrap {
        width: 170px;
        height: 170px;
      }

      .name {
        font-size: 24px;

        -webkit-text-stroke:
          1.3px black;

        margin-bottom: 20px;
      }

      .logo {
        width: 165px;
      }

    }

  </style>

</head>

<body>

  <main class="card">


    <!-- LOGO -->

    <img
      class="logo"
      src="./logo.png?v=10"
      alt="Ríos de Agua Viva Apostolic Church"
    >


    <!-- FOTO DEL PASTOR -->

    <div class="photo-wrap">

      <img
        class="photo"
        src="./pastor.jpg?v=10"
        alt="Pastor Herminio C. Leal"
      >

    </div>


    <!-- NOMBRE -->

    <h1 class="name">
      Pastor Herminio C. Leal
    </h1>


    <div class="buttons">


      <!-- LLAMAR -->

      <a
        class="btn btn-primary"
        href="tel:+18163090938"
      >

        <span class="icon">
          ☎
        </span>

        Call Pastor Leal

      </a>


      <!-- AGREGAR CONTACTO -->

      <button
        class="btn"
        type="button"
        onclick="addContact()"
      >

        <span class="icon">
          👤
        </span>

        Agregar a Contactos

      </button>


      <!-- AGREGAR A PANTALLA DE INICIO -->

      <button
        class="btn install-btn"
        type="button"
        onclick="installApp()"
      >

        <span class="icon">
          📲
        </span>

        Agregar a Pantalla de Inicio

      </button>


      <!-- MENSAJE INSTALACIÓN -->

      <div
        id="installBox"
        class="install-box"
      >

        <strong>
          Agregar Pastor Leal a tu teléfono
        </strong>

        <br><br>

        En iPhone presiona
        <b>Compartir</b> ⬆️

        <br>

        y selecciona

        <br>

        <b>
          Agregar a pantalla de inicio
        </b>

        <br><br>

        Después presiona
        <b>Agregar</b>.

        <br>

        <button
          class="install-close"
          type="button"
          onclick="closeInstall()"
        >

          Cerrar

        </button>

      </div>


      <!-- COMPARTIR -->

      <button
        class="btn share-btn"
        type="button"
        onclick="sharePage()"
      >

        <span class="icon">
          🔗
        </span>

        Compartir esta página

      </button>


      <!-- =====================================
           HORARIO DE SERVICIOS
           NUEVA IMAGEN: horarios.png
           ===================================== -->

      <button
        class="btn"
        type="button"
        onclick="toggleHorario()"
      >

        <span class="icon">
          📅
        </span>

        Horario de Servicios

      </button>


      <div
        id="horarioBox"
        class="horario-box"
      >

        <img
          class="horario-img"
          src="./horarios.png?v=12"
          alt="Horarios / Service Times"
        >

      </div>


      <!-- FACEBOOK -->

      <a
        class="btn"
        href="https://www.facebook.com/share/1EShZ44Z7V/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icon">
          f
        </span>

        Facebook

      </a>


      <!-- YOUTUBE -->

      <a
        class="btn youtube-btn"
        href="https://www.youtube.com/@riosdeaguavivaks1087/streams"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="youtube-icon">
          ▶
        </span>

        YouTube / Transmisiones

      </a>


      <!-- DONACIONES -->

      <a
        class="btn"
        href="https://venmo.com/u/RiosDeAguaViva-ApostolicChurch"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icon">
          💝
        </span>

        Donaciones

      </a>


      <!-- CONTRIBUCIONES -->

      <a
        class="btn"
        href="https://venmo.com/u/RiosDeAguaViva-ApostolicChurch"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icon">
          🙏
        </span>

        Contribuciones

      </a>


      <!-- UBICACIÓN -->

      <a
        class="btn"
        href="https://www.google.com/maps/search/?api=1&query=4000+Victory+Dr+Kansas+City+KS+66102"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icon">
          📍
        </span>

        Cómo Llegar

      </a>


    </div>

  </main>


  <script>


    /* =========================
       MOSTRAR / OCULTAR HORARIO
       ========================= */

    function toggleHorario() {

      const horario =
        document.getElementById(
          "horarioBox"
        );

      if (
        horario.style.display ===
        "block"
      ) {

        horario.style.display =
          "none";

      } else {

        horario.style.display =
          "block";

        setTimeout(function() {

          horario.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
          });

        }, 100);

      }

    }


    /* =========================
       INSTALAR EN TELÉFONO
       ========================= */

    let deferredPrompt;

    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();

        deferredPrompt =
          event;

      }
    );


    function installApp() {

      if (deferredPrompt) {

        deferredPrompt.prompt();

        deferredPrompt
          .userChoice
          .then(
            function() {

              deferredPrompt =
                null;

            }
          );

      } else {

        document
          .getElementById(
            "installBox"
          )
          .style
          .display =
            "block";

      }

    }


    function closeInstall() {

      document
        .getElementById(
          "installBox"
        )
        .style
        .display =
          "none";

    }


    /* =========================
       COMPARTIR PÁGINA
       ========================= */

    async function sharePage() {

      const shareData = {

        title:
          "Pastor Herminio C. Leal",

        text:
          "Contacto de Pastor Herminio C. Leal - Ríos de Agua Viva",

        url:
          "https://riosdeaguavivaks.github.io/pastor-herminio/"

      };


      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

        } catch (error) {

          console.log(
            "Compartir cancelado"
          );

        }

      } else {

        try {

          await navigator
            .clipboard
            .writeText(
              shareData.url
            );

          alert(
            "El enlace fue copiado. Ahora puedes compartirlo."
          );

        } catch (error) {

          alert(
            "Copia este enlace: " +
            shareData.url
          );

        }

      }

    }


    /* =========================
       AGREGAR CONTACTO
       ========================= */

    function addContact() {

      const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Leal;Herminio C.;;Pastor;
FN:Pastor Herminio C. Leal
ORG:Iglesia Apostólica Ríos de Agua Viva
TITLE:Pastor
TEL;TYPE=CELL:+18163090938
ADR;TYPE=WORK:;;4000 Victory Dr.;Kansas City;KS;66102;USA
URL:https://riosdeaguavivaks.github.io/pastor-herminio/
URL:https://www.facebook.com/share/1EShZ44Z7V/?mibextid=wwXIfr
URL:https://www.youtube.com/@riosdeaguavivaks1087/streams
URL:https://venmo.com/u/RiosDeAguaViva-ApostolicChurch
NOTE:NFC Card: https://riosdeaguavivaks.github.io/pastor-herminio/
END:VCARD`;

      const blob =
        new Blob(
          [vcard],
          {
            type:
              "text/vcard;charset=utf-8"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const link =
        document.createElement(
          "a"
        );

      link.href =
        url;

      link.download =
        "Pastor-Herminio-C-Leal.vcf";

      document.body
        .appendChild(
          link
        );

      link.click();

      document.body
        .removeChild(
          link
        );

      setTimeout(
        function() {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );

    }

  </script>

</body>
</html>
