<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063b91">

  <title>Pastor Herminio C. Leal | Ríos de Agua Viva</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #063b91;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background-image:
        linear-gradient(
          rgba(0, 35, 100, 0.10),
          rgba(0, 20, 65, 0.18)
        ),
        url("fondorav.png");

      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;

      color: white;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 24px 15px 40px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 185px;
      max-width: 48%;
      margin: 0 auto 10px;
      display: block;
      object-fit: contain;

      filter: drop-shadow(0 5px 12px rgba(0,0,0,.45));
    }

    .photo-wrap {
      width: 190px;
      height: 190px;
      margin: 0 auto 18px;

      border-radius: 50%;
      padding: 5px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #7ec8ff,
          #ffffff
        );

      box-shadow:
        0 0 20px rgba(80,180,255,.75),
        0 12px 40px rgba(0,0,0,.45);
    }

    .photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;

      object-fit: cover;
      object-position: center top;

      display: block;

      border: 4px solid #063b91;
    }

    .name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;

      margin: 5px 0;

      color: white;

      text-shadow:
        0 2px 5px rgba(0,0,0,.85);
    }

    .title {
      color: #eef7ff;
      font-size: 16px;

      margin-bottom: 8px;

      text-shadow:
        0 2px 4px rgba(0,0,0,.8);
    }

    .address {
      color: white;
      font-size: 14px;
      line-height: 1.5;

      margin: 0 auto 25px;

      text-shadow:
        0 2px 5px rgba(0,0,0,.9);
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      width: 100%;
      min-height: 57px;

      border:
        1px solid rgba(110,210,255,.70);

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          rgba(0,105,205,.92),
          rgba(0,52,125,.95)
        );

      color: white;

      text-decoration: none;

      font-size: 17px;
      font-weight: bold;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      box-shadow:
        0 8px 22px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.20);

      cursor: pointer;

      transition:
        transform .15s ease,
        filter .15s ease;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .btn:hover {
      filter: brightness(1.08);
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #b7d9f7
        );

      color: #06346d;
      border: none;
    }

    .youtube-btn {
      background:
        linear-gradient(
          135deg,
          #ff2020,
          #bc0000
        );

      border:
        1px solid rgba(255,255,255,.35);
    }

    .icon {
      font-size: 21px;
    }

    .youtube-icon {
      font-size: 23px;
    }

    .horario-box {
      display: none;
      width: 100%;
    }

    .horario-img {
      width: 100%;
      height: auto;

      display: block;

      border-radius: 15px;

      box-shadow:
        0 10px 30px rgba(0,0,0,.40);
    }

    @media (max-width: 390px) {

      .photo-wrap {
        width: 170px;
        height: 170px;
      }

      .name {
        font-size: 24px;
      }

      body {
        background-attachment: scroll;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- LOGO -->
    <img
      class="logo"
      src="logo.png"
      alt="Ríos de Agua Viva Apostolic Church"
    >

    <!-- FOTO DEL PASTOR -->
    <div class="photo-wrap">

      <img
        class="photo"
        src="pastor.jpg"
        alt="Pastor Herminio C. Leal"
      >

    </div>

    <!-- NOMBRE -->
    <h2 class="name">
      Pastor Herminio C. Leal
    </h2>

    <div class="title">
      Pastor
    </div>

    <!-- DIRECCIÓN -->
    <div class="address">
      4000 Victory Dr.<br>
      Kansas City, KS 66102
    </div>

    <!-- BOTONES -->
    <div class="buttons">

      <!-- LLAMAR -->
      <a
        class="btn btn-primary"
        href="tel:+18163090938"
      >
        <span class="icon">☎</span>
        Call Pastor Herminio
      </a>

      <!-- AGREGAR CONTACTO -->
      <button
        class="btn"
        type="button"
        onclick="addContact()"
      >
        <span class="icon">👤</span>
        Agregar a Contactos
      </button>

      <!-- HORARIO -->
      <button
        class="btn"
        type="button"
        onclick="toggleHorario()"
      >
        <span class="icon">📅</span>
        Horario de Servicios
      </button>

      <div
        id="horarioBox"
        class="horario-box"
      >
        <img
          class="horario-img"
          src="Horario.png"
          alt="Horario de Servicios"
        >
      </div>

      <!-- FACEBOOK -->
      <a
        class="btn"
        href="https://www.facebook.com/share/1EShZ44Z7V/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">f</span>
        Facebook
      </a>

      <!-- YOUTUBE -->
      <a
        class="btn youtube-btn"
        href="https://www.youtube.com/@riosdeaguavivaks1087/streams"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="youtube-icon">▶</span>
        YouTube / Transmisiones
      </a>

      <!-- DONACIONES -->
      <a
        class="btn"
        href="https://venmo.com/u/RiosDeAguaViva-ApostolicChurch"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">💝</span>
        Donaciones
      </a>

      <!-- CONTRIBUCIONES -->
      <a
        class="btn"
        href="https://venmo.com/u/RiosDeAguaViva-ApostolicChurch"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">🙏</span>
        Contribuciones
      </a>

      <!-- UBICACIÓN -->
      <a
        class="btn"
        href="https://www.google.com/maps/search/?api=1&query=4000+Victory+Dr+Kansas+City+KS+66102"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">📍</span>
        Cómo Llegar
      </a>

    </div>

  </main>

  <script>

    function toggleHorario() {

      const horario =
        document.getElementById("horarioBox");

      if (horario.style.display === "block") {

        horario.style.display = "none";

      } else {

        horario.style.display = "block";

      }
    }

    function addContact() {

      const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Leal;Herminio C.;;Pastor;
FN:Pastor Herminio C. Leal
ORG:Iglesia Apostólica Ríos de Agua Viva
TITLE:Pastor
TEL;TYPE=CELL:+18163090938
ADR;TYPE=WORK:;;4000 Victory Dr.;Kansas City;KS;66102;USA
URL:https://riosdeaguavivaks.github.io/pastor-herminio/
URL:https://www.facebook.com/share/1EShZ44Z7V/?mibextid=wwXIfr
URL:https://www.youtube.com/@riosdeaguavivaks1087/streams
URL:https://venmo.com/u/RiosDeAguaViva-ApostolicChurch
NOTE:NFC Card: https://riosdeaguavivaks.github.io/pastor-herminio/ | Facebook: https://www.facebook.com/share/1EShZ44Z7V/?mibextid=wwXIfr | YouTube: https://www.youtube.com/@riosdeaguavivaks1087/streams | Venmo: https://venmo.com/u/RiosDeAguaViva-ApostolicChurch
END:VCARD`;

      const blob =
        new Blob(
          [vcard],
          {
            type: "text/vcard;charset=utf-8"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "Pastor-Herminio-C-Leal.vcf";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }

  </script>

</body>
</html>
